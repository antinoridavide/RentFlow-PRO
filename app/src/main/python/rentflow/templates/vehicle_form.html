{% extends 'base.html' %}{% block h1 %}{{ 'Modifica veicolo' if vehicle else 'Nuovo veicolo' }}{% endblock %}{% block content %}<section class="panel form"><form method="post"><div class="grid3">
<label>Targa<input name="plate" required value="{{ vehicle.plate if vehicle else '' }}"></label><label>Marca<input name="brand" required value="{{ vehicle.brand if vehicle else '' }}"></label><label>Modello<input name="model" required value="{{ vehicle.model if vehicle else '' }}"></label>
<label>Categoria<input name="category" value="{{ vehicle.category if vehicle else '' }}"></label><label>Tariffa giornaliera €<input type="number" step="0.01" name="daily_rate" value="{{ vehicle.daily_rate if vehicle else 0 }}"></label><label>Chilometraggio<input type="number" name="mileage" value="{{ vehicle.mileage if vehicle else 0 }}"></label>
<label>Stato<select name="status">{% for s in ['Disponibile','Noleggiato','Manutenzione','Fuori servizio'] %}<option {% if vehicle and vehicle.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label>Scadenza assicurazione<input type="date" name="insurance_due" value="{{ vehicle.insurance_due if vehicle and vehicle.insurance_due else '' }}"></label><label>Scadenza revisione<input type="date" name="inspection_due" value="{{ vehicle.inspection_due if vehicle and vehicle.inspection_due else '' }}"></label><label>Scadenza bollo<input type="date" name="tax_due" value="{{ vehicle.tax_due if vehicle and vehicle.tax_due else '' }}"></label>
</div><h2 style="margin-top:18px">Dati CaRGOS</h2><div class="grid3"><label>Tipo veicolo (codice CaRGOS)<input name="cargos_vehicle_type" maxlength="1" value="{{ vehicle.cargos_vehicle_type if vehicle else '' }}"></label><label>Colore<input name="color" maxlength="50" value="{{ vehicle.color if vehicle else '' }}"></label><label class="checkline"><span><input type="checkbox" name="gps" {% if vehicle and vehicle.gps %}checked{% endif %}> GPS presente</span><span><input type="checkbox" name="engine_block" {% if vehicle and vehicle.engine_block %}checked{% endif %}> Blocco motore presente</span></label></div>
<label>Note<textarea name="notes">{{ vehicle.notes if vehicle else '' }}</textarea></label><button class="btn">Salva veicolo</button></form></section>{% endblock %}
