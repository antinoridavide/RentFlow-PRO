{% extends 'base.html' %}{% block h1 %}Nuovo noleggio{% endblock %}{% block subtitle %}Compila anche i dati CaRGOS per preparare l'invio automatico{% endblock %}{% block content %}<section class="panel form"><form method="post"><div class="grid">
<label>Veicolo<select name="vehicle_id" required><option value="">Seleziona...</option>{% for v in vehicles %}<option value="{{ v.id }}">{{ v.brand }} {{ v.model }} · {{ v.plate }} · €{{ '%.2f'|format(v.daily_rate) }}/g · {{ v.status }}</option>{% endfor %}</select></label><label>Cliente<select name="customer_id" required><option value="">Seleziona...</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.last_name }} {{ c.first_name }}</option>{% endfor %}</select></label>
<label>Data ritiro<input type="date" name="start_date" required></label><label>Ora ritiro<input type="time" name="pickup_time" value="09:00" required></label><label>Data riconsegna<input type="date" name="end_date" required></label><label>Ora riconsegna<input type="time" name="return_time" value="09:00" required></label>
<label>Totale € (opzionale)<input type="number" step="0.01" name="total"></label><label>Cauzione €<input type="number" step="0.01" name="deposit" value="0"></label><label>Km consegna<input type="number" name="pickup_km" value="0"></label><label>Carburante consegna<select name="fuel_out"><option>Pieno</option><option>3/4</option><option>1/2</option><option>1/4</option><option>Riserva</option></select></label><label>Stato<select name="status"><option>Prenotato</option><option>In corso</option></select></label>
</div><h2 style="margin-top:18px">Dati CaRGOS del contratto</h2><div class="grid3"><label>Tipo pagamento (codice)<input name="cargos_payment_type" maxlength="1" placeholder="Tabella CaRGOS"></label><label>Codice luogo ritiro<input name="checkout_place_code" maxlength="9"></label><label>Indirizzo ritiro<input name="checkout_address" maxlength="150"></label><label>Codice luogo riconsegna<input name="checkin_place_code" maxlength="9"></label><label>Indirizzo riconsegna<input name="checkin_address" maxlength="150"></label><label>ID operatore<input name="operator_id" maxlength="50" placeholder="Se vuoto usa utente CaRGOS"></label></div>
<label>Note / condizioni particolari<textarea name="notes"></textarea></label><button class="btn">Crea noleggio</button></form></section>{% endblock %}
